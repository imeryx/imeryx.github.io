    <canvas id="snow-canvas"></canvas>
    <div id="enter-screen">
        <p class="blink-text"> Click to enter </p>
    </div>

    <audio id="bg-music" loop>
        <source src="bgmusic.mp3" type="audio/mpeg">
    </audio>

    <div id="main-content" class="hidden">
        
        <div class="bio-container">
            
            <img src="Yuta Okkotsu.jpeg" alt="Avatar" class="main-avatar">
            <h1 class="main-username">Eryx</h1>
            
           
            
            <div id="discord-profile-card">
                <div class="discord-avatar-wrapper">
                    <img id="discord-avatar" src="" alt="Discord Avatar">
                    <div id="discord-status-dot"></div>
                </div>
                <div id="discord-info">
                    <div id="discord-name-row">
                        <span id="discord-username">Đang tải...</span>
                    </div>
                    <div id="discord-status-row">
                        <span id="discord-presence">Loading status...</span>

                </div>

            <div class="social-links">

    <div id="music-player" class="hidden">
        <span id="current-time">0:00</span>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <span id="total-time">0:00</span>
        
        <div class="music-controls">
            <button id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
            <button id="play-pause-btn"><i class="fa-solid fa-pause"></i></button>
            <button id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
        </div>
    </div>
    <div id="view-counter" class="hidden">
        <i class="fa-regular fa-eye"></i> <span id="view-count">...</span>
